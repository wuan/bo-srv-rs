[package]
name = "bo-service"
version = "0.1.0"
edition = "2021"
description = "Rust port of the blitzortung JSON-RPC webservice/service layer (LSP-style framing, async I/O)"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "signal"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["clock"] }
bytes = "1"
ini = "2"
futures = "0.3"
log = "0.4"
env_logger = "0.11"
# CLI data import tools (bo-insert / bo-update): blocking HTTP with basic auth.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# bo-insert-websocket: async websocket client.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rand = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
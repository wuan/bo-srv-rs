[package]
name = "bo-service"
version = "0.1.0"
edition = "2021"
description = "Rust port of the blitzortung JSON-RPC webservice/service layer (LSP-style framing, async I/O)"
license = "Apache-2.0"
default-run = "bo-webservice"

[[bin]]
name = "bo-webservice"
path = "src/bin/bo-webservice.rs"

# CLI tools ported from the Python `blitzortung/cli` package; the names match
# `pyproject.toml` `[project.scripts]` (bo-python).
[[bin]]
name = "bo-db"
path = "src/bin/bo-db.rs"

[[bin]]
name = "bo-import"
path = "src/bin/bo-import.rs"

[[bin]]
name = "bo-update"
path = "src/bin/bo-update.rs"

[[bin]]
name = "bo-import-websocket"
path = "src/bin/bo-import-websocket.rs"

[features]
# Opt-in database integration tests (`tests/postgres_integration.rs`): they
# start an ephemeral PostGIS container with testcontainers, so Docker is
# required. Gated so the default `cargo test` does not depend on a running
# Docker daemon; the CI coverage job enables it (ubuntu host with Docker) so the
# database suite is included in the Sonar report.
db-integration = []

[[test]]
name = "postgres_integration"
required-features = ["db-integration"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "signal"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["clock"] }
# --tz support in the bo-db CLI (IANA time zones like "Europe/Berlin").
chrono-tz = "0.10"
bytes = "1"
ini = "2"
futures = "0.3"
log = "0.4"
env_logger = "0.11"
# Async `QueryExecutor` trait objects (`Arc<dyn QueryExecutor>`); native
# `async fn` in traits is not `dyn`-compatible.
async-trait = "0.1"
# CLI option parsing for the bo-* tools (replaces the hand-written parser).
clap = { version = "4", features = ["derive"] }
# CLI data import tools (bo-import / bo-update): blocking HTTP with basic auth.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# bo-import-websocket: async websocket client.
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
rand = "0.10"

# gzip response compression in the HTTP transport (txjsonrpc `handle_compression`).
flate2 = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
# Ephemeral PostGIS container for the database integration suite. The
# `blocking` feature enables `SyncRunner`, so the fixture can start the
# container without a Tokio runtime (the executor is then driven by the test's
# own `runtime.block_on`).
testcontainers = { version = "0.27", features = ["blocking"] }
testcontainers-modules = { version = "0.15", features = ["postgres"] }

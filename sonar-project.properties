sonar.projectKey=wuan_bo-srv-rs
sonar.organization=wuan
sonar.sources=src

# Binary entry points are process-level glue (runtime setup, signal handling,
# blocking server loops) that cannot be exercised by unit tests; exclude them
# from coverage so the quality gate reflects the testable library code.
sonar.coverage.exclusions=src/bin/**

sonar.rust.cobertura.reportPaths=./cobertura.xml
community.rust.clippy.reportPaths=./clippy.json

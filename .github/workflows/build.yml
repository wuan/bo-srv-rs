name: Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Runs on the host runner (not a container) so the Docker daemon is reachable
  # and the PostGIS testcontainer's mapped port is on localhost. The database
  # integration suite is enabled during the coverage run via `--features
  # db-integration`, so its tests are included in the Sonar report.
  Build:
    runs-on: ubuntu-latest
    env:
      toolchain: stable
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Cache cargo registry
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain ${{ env.toolchain }}
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          cargo --version
          rustc --version

      - name: Cache cargo build
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Install Cargo Tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Build
        run: cargo build

      - name: Docker info
        run: docker version

      - name: Run Tests with Coverage
        run: cargo tarpaulin --engine llvm --features db-integration --out Xml

      - name: Run Clippy
        run: cargo clippy --message-format=json &> clippy.json

      - name: Update Sonar
        uses: sonarsource/sonarqube-scan-action@v8
        if: github.secret_source == 'Actions'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Build Release
        run: |
          cargo build --release
          for bin in bo-webservice bo-db bo-import bo-update bo-import-websocket; do
            echo "== $bin =="
            ldd "target/release/$bin"
          done

      - name: Upload Release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bo-srv-rs
          path: |
            target/release/bo-webservice
            target/release/bo-db
            target/release/bo-import
            target/release/bo-update
            target/release/bo-import-websocket

      - name: Create Release Archive
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd target/release
          zip "bo-srv-rs-${GITHUB_REF_NAME}.zip" \
            bo-webservice bo-db bo-import bo-update bo-import-websocket

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: target/release/bo-srv-rs-${{ github.ref_name }}.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
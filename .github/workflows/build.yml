name: Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    container: debian:bookworm-slim
    runs-on: ubuntu-latest
    env:
      toolchain: stable
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Cache cargo registry
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Setup build environment
        run: |
          pwd
          cat /etc/debian_version
          apt search glibc
          apt update
          apt upgrade -y
          apt search glibc
          apt install -y curl build-essential gcc cmake pkg-config libssl-dev unzip
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain ${{ env.toolchain }} --target x86_64-unknown-linux-gnu
          . "$HOME/.cargo/env"
          cargo --version
          rustc --version

      - name: Cache cargo build
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Install Cargo Tarpaulin
        run: |
          . "$HOME/.cargo/env" 
          cargo install cargo-tarpaulin

      - name: Build
        run: |
          . "$HOME/.cargo/env"
          cargo build

      - name: Run Tests with Coverage
        run: |
          . "$HOME/.cargo/env" 
          cargo tarpaulin --engine llvm --out Xml

      - name: Run Clippy
        run: |
          . "$HOME/.cargo/env" 
          cargo clippy --message-format=json &> clippy.json

      - name: Prepare environment for Sonar
        run: |
          . "$HOME/.cargo/env"
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Update Sonar
        uses: sonarsource/sonarqube-scan-action@v8
        if: github.secret_source == 'Actions'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Build Release
        run: |
          . "$HOME/.cargo/env" 
          cargo build --release
          for bin in bo-webservice bo-db bo-import bo-update bo-import-websocket; do
            echo "== $bin =="
            ldd "target/release/$bin"
          done

      - name: Upload Release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bo-webservice
          path: |
            target/release/bo-webservice
            target/release/bo-db
            target/release/bo-import
            target/release/bo-update
            target/release/bo-import-websocket